name: foodrush
description: Food delivery app with Sentry monitoring and observability
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sentry_flutter: ^9.21.0
  go_router: ^14.0.0
  flutter_riverpod: ^2.5.1
  dio: ^5.7.0
  google_fonts: ^6.2.0
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.0
  shared_preferences: ^2.3.0
  intl: ^0.19.0
  badges: ^3.1.2
  smooth_page_indicator: ^1.2.0
  uuid: ^4.4.0
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - .env
